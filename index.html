<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Minha Lista</title>
    <style>
        body { font-family: Helvetica, sans-serif; background: #f4f2ef; padding: 20px; color: #444; }
        h2 { font-size: 2em; border-bottom: 2px solid #ccc; margin-top: 20px; }
        ul { list-style: none; padding: 0; }
        li { background: #fff; padding: 20px; margin: 10px 0; border-radius: 10px; font-size: 1.5em; cursor: pointer; }
        .feito { text-decoration: line-through; color: #aaa; opacity: 0.6; }
    </style>
</head>
<body>
    <h2>Diárias</h2>
    <ul id="listaDia"></ul>
    <h2>Semanais</h2>
    <ul id="listaSem"></ul>

    <script>
        var d = ["Caixa de Areia Gatos", "Ração Gatos", "Água Gatos", "Lavar Louça", "Encher Garrafas", "Verificar/Aspirar casa", "Dobrar Roupas"];
        var s = ["Aspirar Casa", "Passar Pano", "Lavar Roupas", "Verificar/Limpar caixa de areia", "Verificar/Limpar potes de ração", "Verificar/Limpar Fonte de água"];

        // Carrega o estado das semanais
        var semanaisFeitas = JSON.parse(localStorage.getItem('semanaisFeitas') || "[]");

        function render() {
            // Renderiza Diárias (sempre limpas)
            document.getElementById("listaDia").innerHTML = d.map(function(t){
                return "<li onclick='riscarDia(this)'>☐ " + t + "</li>"
            }).join("");

            // Renderiza Semanais (mantém estado)
            document.getElementById("listaSem").innerHTML = s.map(function(t, i){
                var feita = semanaisFeitas.indexOf(i) > -1;
                return "<li class='"+(feita ? 'feito' : '')+"' onclick='riscarSem(this, "+i+")'>" + 
                       (feita ? '✔️ ' : '☐ ') + t + "</li>"
            }).join("");
        }

        function riscarDia(el) {
            el.className = (el.className === 'feito') ? '' : 'feito';
            el.innerHTML = (el.className === 'feito') ? el.innerHTML.replace('☐', '✔️') : el.innerHTML.replace('✔️', '☐');
        }

        function riscarSem(el, i) {
            var idx = semanaisFeitas.indexOf(i);
            if (idx > -1) semanaisFeitas.splice(idx, 1);
            else semanaisFeitas.push(i);
            localStorage.setItem('semanaisFeitas', JSON.stringify(semanaisFeitas));
            render();
        }

        // Lógica de reset
        function checarReset() {
            var agora = new Date();
            var ultimaData = localStorage.getItem('ultimaData');
            var hojeStr = agora.toDateString();

            if (ultimaData !== hojeStr) {
                // Reset da Semanal: se for segunda-feira, limpa tudo
                if (agora.getDay() === 1) {
                    localStorage.setItem('semanaisFeitas', "[]");
                    semanaisFeitas = [];
                }
                localStorage.setItem('ultimaData', hojeStr);
                location.reload(); // Atualiza a página para limpar as diárias
            }
        }

        setInterval(checarReset, 60000);
        render();
    </script>
</body>
</html>
