<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Lista</title>
    <style>
        body { font-family: Helvetica, sans-serif; background: #f4f2ef; padding: 20px; }
        h2 { font-size: 2em; border-bottom: 2px solid #ccc; }
        ul { list-style: none; padding: 0; }
        li { background: #fff; padding: 20px; margin: 10px 0; border-radius: 10px; font-size: 1.5em; }
    </style>
</head>
<body>
    <h2>Diárias</h2>
    <ul id="listaDia"></ul>
    <h2>Semanais</h2>
    <ul id="listaSem"></ul>

    <script>
        var d = ["Caixa de Areia Gatos", "Ração Gatos", "Água Gatos", "Lavar Louça", "Encher Garrafas", "Verificar/Aspirar casa", "Dobrar Roupas"];
        var s = ["Aspirar Casa", "Passar Pano", "Lavar Roupas", "Verificar/Limpar caixa de areia", "Verificar/Limpar potes de ração", "Verificar/Limpar Fonte de água"];

        function render() {
            document.getElementById("listaDia").innerHTML = d.map(function(t){return "<li>"+t+"</li>"}).join("");
            document.getElementById("listaSem").innerHTML = s.map(function(t){return "<li>"+t+"</li>"}).join("");
        }
        render();
    </script>
</body>
</html>
